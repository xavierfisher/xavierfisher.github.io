<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Centered Rounded Square with Line</title>
<style>
  :root{
    --box-size: 320px;         /* change the square size */
    --box-bg: #d0d0d0;         /* box color (grey) */
    --line-color: #9f9f9f;     /* line color (a bit darker) */
    --border-radius: 20px;     /* corner roundness */
    --line-thickness: 3px;     /* thickness of the middle line */
    --side-inset: 16px;        /* how far the line is inset from the box sides */
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f6f6f6;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .box {
    width: var(--box-size);
    height: var(--box-size);
    background: var(--box-bg);
    border-radius: var(--border-radius);
    position: relative;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    overflow: hidden;
  }

  /* horizontal middle line */
  .box .middle-line {
    position: absolute;
    left: var(--side-inset);
    right: var(--side-inset);
    top: 50%;
    height: var(--line-thickness);
    background: var(--line-color);
    transform: translateY(-50%);
    border-radius: 2px;
  }
</style>
</head>
<body>
  <div class="box" aria-label="Rounded grey square">
    <div class="middle-line" role="separator" aria-orientation="horizontal"></div>
  </div>
</body>
</html>
