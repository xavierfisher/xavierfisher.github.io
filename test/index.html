<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Countdown Timer with Custom Sound</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 20vh;
            background-color: #f4f4f4;
        }
        #timer {
            font-size: 5rem;
            font-weight: bold;
            color: #333;
        }
        button {
            padding: 10px 20px;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="timer">10</div>
    <button id="startBtn">Start Countdown</button>

    <script>
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        
        let timeLeft = 10; 
        let countdownInterval;

        // 1. Load your custom audio file
        const tickSound = new Audio('assets/ezgif-10be97e5f44ce11c_looped_looped (edited with Audjust).mp3');

        function playTickSound() {
            // Reset the audio to the beginning in case the last tick hasn't finished playing
            tickSound.currentTime = 0; 
            
            // Play the sound
            tickSound.play().catch(error => {
                console.log("Audio playback failed:", error);
            });
        }

        function startCountdown() {
            startBtn.disabled = true; 
            
            // Play immediately on start click, then let setInterval take over
            playTickSound(); 

            countdownInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                
                if (timeLeft >= 0) {
                    playTickSound();
                }

                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    timerDisplay.textContent = "Time's up!";
                }
            }, 1000);
        }

        startBtn.addEventListener('click', startCountdown);
    </script>

</body>
</html>
