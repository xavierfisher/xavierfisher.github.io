<script>
  const wallpapers = [
    "https://picsum.photos/id/1015/1920/1080",
    "https://picsum.photos/id/1016/1920/1080",
    "https://picsum.photos/id/1018/1920/1080",
    "https://picsum.photos/id/1019/1920/1080",
    "https://picsum.photos/id/1020/1920/1080",
    "https://picsum.photos/id/1021/1920/1080",
    "https://picsum.photos/id/1022/1920/1080",
    "https://picsum.photos/id/1023/1920/1080",
    "https://picsum.photos/id/1024/1920/1080",
    "https://picsum.photos/id/1025/1920/1080"
  ];

  const wallpaperEl = document.getElementById("wallpaper");
  const fadeEl = document.getElementById("fade");

  const FADE_MS = 500;
  const DISPLAY_MS = 7000;

  let currentIndex = -1;

  wallpapers.forEach(src => {
    const img = new Image();
    img.src = src;
  });

  function pickRandomIndex() {
    let next = Math.floor(Math.random() * wallpapers.length);
    while (next === currentIndex && wallpapers.length > 1) {
      next = Math.floor(Math.random() * wallpapers.length);
    }
    return next;
  }

  function showWallpaper(i) {
    wallpaperEl.style.backgroundImage = `url("${wallpapers[i]}")`;
  }

  function cycle() {
    fadeEl.style.opacity = 1;

    setTimeout(() => {
      currentIndex = pickRandomIndex();
      showWallpaper(currentIndex);

      requestAnimationFrame(() => {
        fadeEl.style.opacity = 0;
      });
    }, FADE_MS);

    setTimeout(cycle, DISPLAY_MS);
  }

  currentIndex = pickRandomIndex();
  showWallpaper(currentIndex);
  setTimeout(cycle, DISPLAY_MS);
</script>
