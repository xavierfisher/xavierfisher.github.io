<script>
  // 10 wallpaper URLs — replace these with your own images
  const wallpapers = [
    "xavierfisher.uk/wallpapers/wallhaven-3kpy56.jpg",
    "xavierfisher.uk/wallpapers/wallhaven-d6g8zg.jpg",
    "xavierfisher.uk/wallpapers/wallhaven-kw9yp6.jpg",
    "xavierfisher.uk/wallpapers/wallhaven-m31jo8.jpg",
    "xavierfisher.uk/wallpapers/wallhaven-m3dgjm.jpg",
    "xavierfisher.uk/wallpapers/wallhaven-o55yom.jpg",
    "xavierfisher.uk/wallpapers/wallhaven-mpyly8.jpg",
    "xavierfisher.uk/wallpapers/wallhaven-vqqzo8.jpg",
    "xavierfisher.uk/wallpapers/wallhaven-weq1xp.jpg",
    "xavierfisher.uk/wallpapers/wallhaven-zym9ej.jpg"
  ];

  const wallpaperEl = document.getElementById("wallpaper");
  const fadeEl = document.getElementById("fade");

  const FADE_MS = 500;       // 0.5 seconds fade
  const DISPLAY_MS = 15000;  // 15 seconds per wallpaper

  let index = 0;

  // Preload images so transitions are smooth
  wallpapers.forEach(src => {
    const img = new Image();
    img.src = src;
  });

  function showWallpaper(i) {
    wallpaperEl.style.backgroundImage = `url("${wallpapers[i]}")`;
  }

  function cycle() {
    // Fade to white
    fadeEl.style.opacity = 1;

    // After fade completes, swap the wallpaper and fade back from white
    setTimeout(() => {
      index = (index + 1) % wallpapers.length;
      showWallpaper(index);

      // Small delay so the new image is painted before fading out the white
      requestAnimationFrame(() => {
        fadeEl.style.opacity = 0;
      });
    }, FADE_MS);

    // Schedule the next cycle: 15s display + 0.5s fade (the fade overlaps display start)
    setTimeout(cycle, DISPLAY_MS);
  }

  // Start with the first wallpaper, then begin cycling
  showWallpaper(index);
  setTimeout(cycle, DISPLAY_MS);
</script>
