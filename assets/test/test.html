<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpaper Shuffle Example</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            
            transition: background-image 0.8s ease-in-out;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>

    <script>
        
        const wallpapers = [
            'assets/backrounds/sky.jpg',
            'assets/backrounds/pexels-andreas-schnabl-1775843-19487036.jpg',
        ];

        
        let currentIndex = -1;

        function shuffleWallpaper() {
            if (wallpapers.length === 0) return;

            let randomIndex;
            
            
            if (wallpapers.length > 1) {
                do {
                    randomIndex = Math.floor(Math.random() * wallpapers.length);
                } while (randomIndex === currentIndex);
            } else {
                randomIndex = 0;
            }

            currentIndex = randomIndex;
            
            
            document.body.style.backgroundImage = `url('${wallpapers[currentIndex]}')`;
        }

       
        shuffleWallpaper();

        
        setInterval(shuffleWallpaper, 5000);
    </script>

</body>
</html>
